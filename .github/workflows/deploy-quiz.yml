name: deploy-quiz

# 只发布「题库刷题」页面：Word / PDF 导入暂不发布
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cloudfunctions/bankFunctions/builtin-data/**"
      - ".github/workflows/deploy-quiz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖并打包刷题页
        working-directory: web
        run: npm ci && npm run build:quiz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-quiz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
